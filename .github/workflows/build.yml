
name: Build Foice do Agouro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'

      - name: Compile mod
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: Foice-do-Agouro
          path: build/libs/*.jar
          if-no-files-found: error
