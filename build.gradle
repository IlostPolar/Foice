plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.polar.foicedoagouro'

base {
    archivesName = 'FoiceDoAgouro-Forge-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                foicedoagouro {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
            includeGroup 'com.eliotlash.mclib'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.8.5')
    implementation 'com.eliotlash.mclib:mclib:20'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'foicedoagouro',
            'Specification-Vendor'    : 'Polar',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'Polar'
        ])
    }
}

jar.finalizedBy('reobfJar')
